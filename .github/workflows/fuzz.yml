name: Fuzz

# Builds every cargo-fuzz target on nightly and runs each for a short
# bounded budget so a fuzz-harness API drift or a shallow crash shows
# up in CI. Long campaigns run locally (see README "Fuzzing").

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Smoke-run each target (30 s)
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=2048
          done
